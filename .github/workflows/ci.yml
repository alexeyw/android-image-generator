name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        # Accepts the licenses; AGP then fetches the API 37 platform and build-tools itself.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Fetch tokenizer and timestep weights for the parity tests
        # ~17 MB of the upstream checkpoint (pinned revision); without them the tokenizer and
        # adaln tests skip. The 0.78 GB embedding table is not needed by any JVM test.
        run: |
          python3 -m pip install --quiet numpy
          python3 reference/host_assets.py --skip-embed

      - name: Test and assemble
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: app/build/reports/tests/
